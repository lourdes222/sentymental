<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espacio de Expresión & Calma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="encabezado">
        <h1>Espacio de Expresión & Sentimientos</h1>
        <p>Un lugar para entender lo que sentís y recordarte que estás haciendo lo mejor que podés.</p>
    </header>
    <section class="seccion-motivacion">
        <div class="caja-frase">
          <p id="texto-frase">Cargando mensaje...</p>
          <button id="btn-frase">Dame otro impulso</button>
        </div>
    </section>

    <main class="contenedor-principal">
        <div id="contenedor-emociones" class="grilla-emociones"></div>
    </main>

    <section class="seccion-diario">
  <h2>📓 Tu Diario Express</h2>
  <p class="subtitulo-diario">Un espacio libre para volcar lo que tenés en la cabeza hoy.</p>
  
  <div class="caja-diario">
    <textarea id="texto-nota" placeholder="¿Qué estás pensando o sintiendo en este momento?..."></textarea>
    <button id="btn-guardar-nota" class="btn-guardar">Guardar Nota ✨</button>
  </div>

  <div class="historial-notas">
    <h3>Notas anteriores</h3>
    <div id="lista-notas">
    </div>
  </div>
</section>
    <script type="module" src="js/main.js"></script>
</body>
</html>
